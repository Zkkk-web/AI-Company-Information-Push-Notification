name: Startup Intelligence Daily

on:
  workflow_dispatch:
    inputs:
      send_notifications:
        description: "Send qualifying alerts to the configured Feishu webhook"
        required: true
        default: false
        type: boolean

concurrency:
  group: startup-intelligence-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      # ponytail: Actions cache is enough for the 7-10 day pilot; use R2/S3
      # when durable history or multiple runners matter.
      - name: Restore history
        uses: actions/cache/restore@v6
        with:
          path: output
          key: startup-intelligence-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            startup-intelligence-${{ runner.os }}-

      - name: Run crawler
        env:
          # Every run is explicitly dispatched. Notifications stay off unless requested.
          FEISHU_WEBHOOK_URL: ${{ inputs.send_notifications && secrets.FEISHU_WEBHOOK_URL || '' }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          AI_FILTER_ENABLED: ${{ secrets.AI_FILTER_ENABLED }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          DEBUG: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          GITHUB_ACTIONS: true
        run: uv run python -m trendradar

      - name: Save history
        if: always()
        uses: actions/cache/save@v6
        with:
          path: output
          key: startup-intelligence-${{ runner.os }}-${{ github.run_id }}
